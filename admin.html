<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Saarthi Print Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A44; --ink-soft:#3A4A6B; --red:#A83232; --red-dark:#7E2424;
    --gold:#D9A441; --khaki:#E8E2D0; --khaki-dark:#DCD4BC; --paper:#FBF9F4;
    --charcoal:#2B2620; --muted:#8A8370; --success:#3E7A4C; --danger:#A83232;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--khaki);
    font-family:'Mukta', sans-serif; color:var(--charcoal);
  }
  .topbar{
    background:var(--ink); color:#fff; padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  .topbar h1{ font-family:'Baloo 2',sans-serif; font-size:17px; margin:0; }
  .topbar button{
    background:rgba(255,255,255,0.12); border:none; color:#fff;
    padding:7px 12px; border-radius:8px; font-size:12.5px; font-weight:600;
  }
  .container{ max-width:600px; margin:0 auto; padding:16px; }

  #login-screen{
    max-width:380px; margin:60px auto; padding:26px 22px; background:var(--paper);
    border-radius:14px; box-shadow:0 8px 24px rgba(43,38,32,0.1); position:relative; overflow:hidden;
  }
  .tape{ position:absolute; top:0; left:0; right:0; height:4px;
    background:repeating-linear-gradient(90deg, var(--red), var(--red) 10px, var(--gold) 10px, var(--gold) 14px); }
  #login-screen h2{ font-family:'Baloo 2',sans-serif; color:var(--ink); margin:8px 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input{
    width:100%; padding:12px 13px; border:1.5px solid var(--khaki-dark); border-radius:9px;
    background:#fff; font-size:14.5px; outline:none;
  }
  .field select{
    width:100%; padding:12px 13px; border:1.5px solid var(--khaki-dark); border-radius:9px;
    background:#fff; font-size:14.5px; outline:none; font-family:'Mukta',sans-serif;
  }
  .btn{
    width:100%; padding:12px; border:none; border-radius:9px; background:var(--ink);
    color:#fff; font-family:'Baloo 2',sans-serif; font-weight:600; font-size:15px; cursor:pointer;
    position:relative;
  }
  .btn:disabled{ opacity:0.75; cursor:not-allowed; color:transparent !important; }
  .btn:disabled::after{
    content:''; position:absolute; top:50%; left:50%; width:16px; height:16px;
    margin:-8px 0 0 -8px; border:2.5px solid rgba(255,255,255,0.4); border-top-color:#fff;
    border-radius:50%; animation:btnspin .6s linear infinite;
  }
  @keyframes btnspin{ to{ transform:rotate(360deg); } }
  .btn.small{ width:auto; padding:8px 14px; font-size:13px; }
  .btn.gold{ background:linear-gradient(145deg,var(--gold),#b9832c); }
  .btn.danger{ background:var(--red); }
  .msg{ padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none; }
  .msg.error{ background:rgba(168,50,50,0.09); color:var(--red-dark); display:block; }

  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{
    flex:1; text-align:center; padding:10px; border-radius:9px; background:var(--paper);
    font-weight:600; font-size:13.5px; color:var(--ink-soft); cursor:pointer;
    font-family:'Baloo 2',sans-serif;
  }
  .tab.active{ background:var(--ink); color:#fff; }

  .card{
    background:var(--paper); border-radius:12px; padding:16px; margin-bottom:12px;
    box-shadow:0 1px 2px rgba(43,38,32,0.06), 0 4px 12px rgba(43,38,32,0.06);
  }
  .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; color:var(--ink); }
  .meta{ font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.6; }
  .mono{ font-family:'JetBrains Mono',monospace; font-size:12px; }
  .badge{ padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
  .badge.pending{ background:rgba(217,164,65,0.2); color:#8a6416; }
  .badge.active{ background:rgba(62,122,76,0.15); color:var(--success); }
  .badge.deactivated{ background:rgba(168,50,50,0.12); color:var(--red-dark); }
  .actions{ display:flex; gap:8px; margin-top:12px; }
  .empty{ text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }
  .hidden{ display:none !important; }
  .field-row{ display:flex; gap:8px; margin-bottom:8px; }
  .field-row input{ flex:1; padding:10px 12px; border:1.5px solid var(--khaki-dark); border-radius:8px; font-size:13.5px; }
  .remove-field-btn{ background:var(--red); color:#fff; border:none; border-radius:8px; width:36px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="tape"></div>
  <h2>Admin Login</h2>
  <div id="login-msg" class="msg"></div>
  <div class="field">
    <label>Admin Email</label>
    <input type="email" id="admin-email" placeholder="admin email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="admin-password" placeholder="password">
  </div>
  <button class="btn" onclick="adminLogin()">Login</button>
</div>

<div id="admin-screen" class="hidden">
  <div class="topbar">
    <h1>Saarthi Print Portal — Admin</h1>
    <button onclick="adminLogout()">Logout</button>
  </div>
  <div class="container">
    <div class="tabs" style="flex-wrap:wrap;">
      <div class="tab active" id="tab-requests" onclick="switchTab('requests')">Pending Users</div>
      <div class="tab" id="tab-users" onclick="switchTab('users')">Active Users</div>
      <div class="tab" id="tab-services" onclick="switchTab('services')">Services</div>
      <div class="tab" id="tab-servicereq" onclick="switchTab('servicereq')">Service Reqs</div>
      <div class="tab" id="tab-autosuccess" onclick="switchTab('autosuccess')">🤖 Auto Successful</div>
      <div class="tab" id="tab-autopending" onclick="switchTab('autopending')">🤖 Pending Retry</div>
      <div class="tab" id="tab-autofailed" onclick="switchTab('autofailed')">🤖 Auto Failed</div>
      <div class="tab" id="tab-wallet" onclick="switchTab('wallet')">Wallet Reqs</div>
      <div class="tab" id="tab-regtx" onclick="switchTab('regtx')">Reg. Transactions</div>
      <div class="tab" id="tab-baltx" onclick="switchTab('baltx')">Balance Transactions</div>
      <div class="tab" id="tab-complaints" onclick="switchTab('complaints')">Complaints</div>
      <div class="tab" id="tab-announce" onclick="switchTab('announce')">Announcement</div>
      <div class="tab" id="tab-adduser" onclick="switchTab('adduser')">Add User</div>
      <div class="tab" id="tab-settings" onclick="switchTab('settings')">Settings</div>
      <div class="tab" id="tab-sales" onclick="switchTab('sales')">📊 Sales</div>
      <div class="tab" id="tab-apiguide" onclick="switchTab('apiguide')">📘 API Guide</div>
    </div>

    <div id="panel-requests"></div>
    <div id="panel-users" class="hidden"></div>
    <div id="panel-services" class="hidden"></div>
    <div id="panel-servicereq" class="hidden"></div>
    <div id="panel-autosuccess" class="hidden"></div>
    <div id="panel-autopending" class="hidden"></div>
    <div id="panel-autofailed" class="hidden"></div>
    <div id="panel-wallet" class="hidden"></div>
    <div id="panel-regtx" class="hidden"></div>
    <div id="panel-baltx" class="hidden"></div>
    <div id="panel-complaints" class="hidden"></div>
    <div id="panel-announce" class="hidden"></div>
    <div id="panel-adduser" class="hidden"></div>
    <div id="panel-settings" class="hidden"></div>
    <div id="panel-sales" class="hidden"></div>
    <div id="panel-apiguide" class="hidden"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, where, getDocs, orderBy, increment
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDsQaWQEkkMRnxsWZou1BF_FYIKNiAHcIA",
    authDomain: "cspseva-f34f2.firebaseapp.com",
    projectId: "cspseva-f34f2",
    storageBucket: "cspseva-f34f2.firebasestorage.app",
    messagingSenderId: "280676555526",
    appId: "1:280676555526:web:08fcea69bd1698db95dc87"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  setPersistence(auth, browserLocalPersistence).catch(()=>{});
  const db = getFirestore(app);

  const ADMIN_EMAIL = "rejaulyt@gmail.com";
  const WORKER_URL = "https://floral-butterfly-1bb0.rejaulyt105.workers.dev";

  // Every function referenced from an inline onclick="..." attribute (like the Delete
  // buttons) MUST be exposed on window — plain function declarations inside a
  // <script type="module"> are module-scoped only and are NOT visible to inline HTML
  // event handlers, even though calls from other module code work fine. This block
  // exposes all of them in one place so this class of bug can't happen again.
  window.loadRegTransactions = loadRegTransactions;
  window.loadBalanceTransactions = loadBalanceTransactions;
  window.loadComplaints = loadComplaints;
  window.loadServiceRequests = loadServiceRequests;
  window.loadAutoRequests = loadAutoRequests;
  window.loadWalletRequests = loadWalletRequests;

  window.adminLogin = async function(){
    const email = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;
    if(!email || !password){ showLoginMsg('Please enter email and password.'); return; }
    if(email.toLowerCase() !== ADMIN_EMAIL){
      showLoginMsg('You are not an admin. Access denied.');
      return;
    }
    try{
      await signInWithEmailAndPassword(auth, email, password);
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('admin-screen').classList.remove('hidden');
      loadRequests();
    }catch(err){
      showLoginMsg('Login fail: ' + (err.message || err.code));
    }
  }

  function showLoginMsg(text){
    const el = document.getElementById('login-msg');
    el.textContent = text; el.className = 'msg error';
  }

  window.adminLogout = async function(){
    await signOut(auth);
    document.getElementById('admin-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
  }

  const TABS = ['requests','users','services','servicereq','autosuccess','autopending','autofailed','wallet','regtx','baltx','complaints','announce','adduser','settings','sales','apiguide'];
  window.switchTab = function(tab){
    TABS.forEach(t=>{
      document.getElementById('tab-'+t).classList.toggle('active', t===tab);
      document.getElementById('panel-'+t).classList.toggle('hidden', t!==tab);
    });
    if(tab==='requests') loadRequests();
    if(tab==='users') loadUsers();
    if(tab==='services') loadServices();
    if(tab==='servicereq') loadServiceRequests();
    if(tab==='autosuccess') loadAutoRequests('success');
    if(tab==='autopending') loadAutoRequests('pending_low_balance');
    if(tab==='autofailed') loadAutoRequests('failed');
    if(tab==='wallet') loadWalletRequests();
    if(tab==='regtx') loadRegTransactions();
    if(tab==='baltx') loadBalanceTransactions();
    if(tab==='complaints') loadComplaints();
    if(tab==='announce') loadAnnouncement();
    if(tab==='adduser') loadAddUserForm();
    if(tab==='settings') loadSettings();
    if(tab==='sales') loadSales();
    if(tab==='apiguide') loadApiGuide();
  }

  async function loadRequests(){
    const panel = document.getElementById('panel-requests');
    panel.innerHTML = '<div class="empty">Loading...</div>';
    const q = query(collection(db,'users'), where('status','in',['pending_payment','pending_review']));
    const snap = await getDocs(q);
    if(snap.empty){
      panel.innerHTML = '<div class="empty">No pending users found.</div>';
      return;
    }
    let html = '';
    for(const d of snap.docs){
      const u = d.data();
      const uid = d.id;
      const awaitingReview = u.status === 'pending_review';
      let utr = '—', amount = u.regPrice;
      try{
        const payDoc = await getDoc(doc(db,'regPayments',uid));
        if(payDoc.exists()){ utr = payDoc.data().utr; amount = payDoc.data().amount; }
      }catch(e){}
      html += `
        <div class="card">
          <div class="row">
            <div>
              <div class="name">${escapeHtml(u.name)}</div>
              <div class="meta">
                📱 ${escapeHtml(u.phone)} &nbsp;•&nbsp; ${escapeHtml(u.accountType)}<br>
                ✉️ ${escapeHtml(u.email)}<br>
                UTR: <span class="mono">${escapeHtml(utr)}</span> &nbsp;•&nbsp; ₹${amount}
              </div>
            </div>
            <span class="badge pending">${awaitingReview ? 'AWAITING REVIEW' : 'FEE NOT PAID'}</span>
          </div>
          <div class="actions">
            <button class="btn small gold" onclick="approveUser('${uid}')">✓ Activate</button>
            ${awaitingReview ? `<button class="btn small danger" onclick="rejectUser('${uid}')">✕ Reject</button>` : ''}
          </div>
        </div>`;
    }
    panel.innerHTML = html;
  }

  window.approveUser = async function(uid){
    if(!confirm('Activate this account?')) return;
    await updateDoc(doc(db,'users',uid), { status: 'active' });
    loadRequests();
  }

  window.rejectUser = async function(uid){
    if(!confirm('Reject this registration? The user will go back to payment pending.')) return;
    await updateDoc(doc(db,'users',uid), { status: 'pending_payment' });
    loadRequests();
  }

  let usersSortMode = 'none';
  window.loadUsers = async function(sortMode){
    if(sortMode) usersSortMode = sortMode;
    const panel = document.getElementById('panel-users');
    panel.innerHTML = '<div class="empty">Loading...</div>';
    const snap = await getDocs(collection(db,'users'));
    const docs = [];
    snap.forEach(d=>{
      const u = d.data();
      if(u.status === 'active' || u.status === 'deactivated') docs.push({id:d.id, ...u});
    });
    if(docs.length === 0){
      panel.innerHTML = '<div class="empty">No active users found.</div>';
      return;
    }
    if(usersSortMode === 'high') docs.sort((a,b)=> (b.walletBalance??0) - (a.walletBalance??0));
    else if(usersSortMode === 'low') docs.sort((a,b)=> (a.walletBalance??0) - (b.walletBalance??0));

    let html = `
      <div class="field" style="margin-bottom:12px;">
        <label>Sort by Wallet Balance</label>
        <select id="users-sort-select" onchange="loadUsers(this.value)">
          <option value="none" ${usersSortMode==='none'?'selected':''}>Default</option>
          <option value="high" ${usersSortMode==='high'?'selected':''}>Balance: High → Low</option>
          <option value="low" ${usersSortMode==='low'?'selected':''}>Balance: Low → High</option>
        </select>
      </div>`;
    for(const u of docs){
      const uid = u.id;
      const statusClass = u.status === 'active' ? 'active' : 'deactivated';
      const isActive = u.status === 'active';
      let regUtr = '—';
      try{
        const payDoc = await getDoc(doc(db,'regPayments',uid));
        if(payDoc.exists()) regUtr = payDoc.data().utr || '—';
      }catch(e){}
      html += `
        <div class="card">
          <div class="row">
            <div>
              <div class="name">${escapeHtml(u.name)}</div>
              <div class="meta">
                📱 ${escapeHtml(u.phone)} &nbsp;•&nbsp; ✉️ ${escapeHtml(u.email)}<br>
                ${escapeHtml(u.accountType)} &nbsp;•&nbsp; 💰 Wallet: ₹${u.walletBalance ?? 0}<br>
                Reg. UTR: <span class="mono">${escapeHtml(regUtr)}</span>
              </div>
            </div>
            <span class="badge ${statusClass}">${escapeHtml(u.status).toUpperCase()}</span>
          </div>
          <div class="field" style="margin-top:10px;">
            <label>Add / Deduct Balance Manually</label>
            <div style="display:flex;gap:8px;">
              <input type="number" id="manual-bal-${uid}" placeholder="Amount" style="flex:1;">
              <button class="btn small gold" onclick="manualAddBalance('${uid}')">Add</button>
              <button class="btn small danger" onclick="manualDeductBalance('${uid}')">Deduct</button>
            </div>
          </div>
          <div class="actions">
            ${isActive ? `<button class="btn small danger" onclick="toggleStatus('${uid}','deactivated')">Deactivate</button>` : `<button class="btn small gold" onclick="toggleStatus('${uid}','active')">Activate</button>`}
            <button class="btn small danger" onclick="deleteUserPermanently('${uid}','${escapeHtml(u.name||'')}','${escapeHtml(u.phone||'')}')">🗑️ Delete Permanently</button>
          </div>
        </div>`;
    }
    panel.innerHTML = html;
  }

  window.manualDeductBalance = async function(uid){
    const input = document.getElementById('manual-bal-'+uid);
    const amount = parseFloat(input.value);
    if(isNaN(amount) || amount <= 0){ alert('Enter a valid amount.'); return; }
    if(!confirm('Deduct ₹'+amount+' from this user wallet?')) return;
    await updateDoc(doc(db,'users',uid), { walletBalance: increment(-amount) });
    await addDoc(collection(db,'walletRequests'), {
      uid, amount: -amount, utr: 'Manual Admin Deduct', status: 'success', submittedAt: new Date().toISOString()
    });
    input.value = '';
    loadUsers();
  }

  window.deleteUserPermanently = async function(uid, name, phone){
    if(!confirm(`PERMANENTLY delete "${name}"'s account AND all their data (requests, transactions, complaints)? This cannot be undone.`)) return;
    if(!confirm('Are you absolutely sure? Type OK on the next prompt is not needed — this is your final confirmation.')) return;
    try{
      // Delete every collection that references this uid so the phone/email is fully free to re-register.
      const collectionsToClean = ['serviceRequests','walletRequests','complaints'];
      for(const col of collectionsToClean){
        const snap = await getDocs(query(collection(db,col), where('uid','==',uid)));
        for(const d of snap.docs) await deleteDoc(doc(db,col,d.id));
      }
      try{ await deleteDoc(doc(db,'regPayments',uid)); }catch(e){}
      if(phone){
        try{ await deleteDoc(doc(db,'phoneIndex',phone)); }
        catch(e){ alert('User data deleted, but phoneIndex cleanup failed: ' + e.message + '\n\nFirestore rules me phoneIndex ke "allow delete" ko isAdmin() karna hoga.'); }
      }
      await deleteDoc(doc(db,'users',uid));
      loadUsers();
    }catch(e){
      alert('Delete failed: ' + e.message + '\n\nAgar "permission" error hai, to Firestore rules me serviceRequests/walletRequests/complaints/regPayments/users ke andar "allow delete: if isAdmin();" add karna hoga.');
    }
  }

  window.manualAddBalance = async function(uid){
    const input = document.getElementById('manual-bal-'+uid);
    const amount = parseFloat(input.value);
    if(isNaN(amount) || amount <= 0){ alert('Enter a valid amount.'); return; }
    if(!confirm('Add this amount to the user wallet?')) return;
    await updateDoc(doc(db,'users',uid), { walletBalance: increment(amount) });
    await addDoc(collection(db,'walletRequests'), {
      uid, amount, utr: 'Manual Admin Add', status: 'success', submittedAt: new Date().toISOString()
    });
    input.value = '';
    loadUsers();
  }

  window.toggleStatus = async function(uid, newStatus){
    await updateDoc(doc(db,'users',uid), { status: newStatus });
    loadUsers();
  }

  // ---------- REGISTRATION TRANSACTIONS ----------
  async function loadRegTransactions(){
    const panel = document.getElementById('panel-regtx');
    panel.innerHTML = '<div class="empty">Loading...</div>';
    const q = query(collection(db,'regPayments'), where('status','in',['success','pending']));
    const snap = await getDocs(q);
    if(snap.empty){ panel.innerHTML = '<div class="empty">No registration transactions yet.</div>'; return; }
    let html = '';
    const rows = [];
    for(const d of snap.docs){
      const r = d.data();
      let u = {};
      try{ const uSnap = await getDoc(doc(db,'users',d.id)); if(uSnap.exists()) u = uSnap.data(); }catch(e){}
      rows.push({ ...r, uid: d.id, name: u.name, phone: u.phone, email: u.email });
    }
    rows.sort((a,b)=> new Date(b.submittedAt||0) - new Date(a.submittedAt||0));
    rows.forEach(r=>{
      const isPending = r.status === 'pending';
      html += `
        <div class="card">
          <div class="row">
            <div>
              <div class="name">${escapeHtml(r.name||'—')}</div>
              <div class="meta">
                📱 ${escapeHtml(r.phone||'—')} &nbsp;•&nbsp; ✉️ ${escapeHtml(r.email||'—')}<br>
                UTR: <span class="mono">${escapeHtml(r.utr||'—')}</span>
              </div>
            </div>
            <span class="badge ${isPending?'pending':'success'}">${isPending?'PENDING':'₹'+r.amount}</span>
          </div>
          ${isPending ? `<div class="actions"><button class="btn small gold" onclick="activateRegPayment('${r.uid}')">✓ Activate Manually</button><button class="btn small danger" onclick="deleteRecordPermanently('regPayments','${r.uid}', loadRegTransactions)">🗑️ Delete</button></div>` : `<div class="actions"><button class="btn small danger" onclick="deleteRecordPermanently('regPayments','${r.uid}', loadRegTransactions)">🗑️ Delete</button></div>`}
        </div>`;
    });
    panel.innerHTML = html;
  }

  window.activateRegPayment = async function(uid){
    if(!confirm('Activate this user and mark registration payment as successful?')) return;
    await updateDoc(doc(db,'users',uid), { status: 'active' });
    await updateDoc(doc(db,'regPayments',uid), { status: 'success' });
    loadRegTransactions();
  }

  // ---------- BALANCE TRANSACTIONS ----------
  async function loadBalanceTransactions(){
    const panel = document.getElementById('panel-baltx');
    panel.innerHTML = '<div class="empty">Loading...</div>';
    const q = query(collection(db,'walletRequests'), where('status','==','success'));
    const snap = await getDocs(q);
    if(snap.empty){ panel.innerHTML = '<div class="empty">No balance transactions yet.</div>'; return; }
    let html = '';
    const rows = [];
    for(const d of snap.docs){
      const r = d.data();
      let u = {};
      try{ const uSnap = await getDoc(doc(db,'users',r.uid)); if(uSnap.exists()) u = uSnap.data(); }catch(e){}
      rows.push({ ...r, id: d.id, name: u.name, email: u.email });
    }
    rows.sort((a,b)=> new Date(b.submittedAt||0) - new Date(a.submittedAt||0));
    rows.forEach(r=>{
      html += `
        <div class="card">

  window.createUserManually = async function(){
    const msgEl = document.getElementById('adduser-msg');
    const name = document.getElementById('au-name').value.trim();
    const phone = document.getElementById('au-phone').value.trim();
    const email = document.getElementById('au-email').value.trim().toLowerCase();
    const password = document.getElementById('au-password').value;
    const accountType = document.getElementById('au-acctype').value;
    const balance = parseFloat(document.getElementById('au-balance').value) || 0;

    if(!name || !phone || !email || !password){
      msgEl.textContent = 'Please fill in all required fields.'; msgEl.className = 'msg error'; return;
    }
    if(password.length < 6){
      msgEl.textContent = 'Password must be at least 6 characters.'; msgEl.className = 'msg error'; return;
    }

    try{
      // Use a secondary Firebase app instance so creating this user
      // does not sign the admin out of their own session.
      const secondaryApp = initializeApp(firebaseConfig, 'SecondaryAddUser_' + Date.now());
      const secondaryAuth = getAuth(secondaryApp);
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
      const uid = cred.user.uid;

      await setDoc(doc(db, 'users', uid), {
        name, phone, email,
        accountType,
        regPrice: accountType === 'retailer' ? 449 : 999,
        status: 'active',
        walletBalance: balance,
        createdAt: new Date().toISOString(),
        createdByAdmin: true
      });
      await setDoc(doc(db, 'phoneIndex', phone), { email });

      await signOut(secondaryAuth);

      msgEl.textContent = 'User created and activated successfully.'; msgEl.className = 'msg success';
      document.getElementById('au-name').value = '';
      document.getElementById('au-phone').value = '';
      document.getElementById('au-email').value = '';
      document.getElementById('au-password').value = '';
      document.getElementById('au-balance').value = '';
    }catch(err){
      msgEl.textContent = 'Something went wrong: ' + (err.message || err.code); msgEl.className = 'msg error';
    }
  }

  function escapeHtml(str){
    if(str === undefined || str === null) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  window.submitNewService = async function(){

    const category = document.getElementById('new-svc-category').value;
    const price = parseFloat(document.getElementById('new-svc-price').value);
    const logoUrl = document.getElementById('new-svc-logo').value.trim();

    const refundPolicy = document.getElementById('new-svc-refund').value.trim();
    const processingTime = document.getElementById('new-svc-time').value.trim();
    const fieldInputs = document.querySelectorAll('.svc-field-input');
    const fields = Array.from(fieldInputs).map(i=>i.value.trim()).filter(Boolean);

    const automated = document.getElementById('new-svc-automated').checked;
    const apiProvider = document.getElementById('new-svc-provider').value.trim().toLowerCase();
    const apiUrl = document.getElementById('new-svc-apiurl').value.trim();
    const apiKeyParam = document.getElementById('new-svc-apikeyparam').value.trim();
    const useXApiKeyHeader = document.getElementById('new-svc-usexapikey').checked;
    const apiMethod = document.getElementById('new-svc-method').value;
    const apiBodyType = document.getElementById('new-svc-bodytype').value;
    const respSuccessField = document.getElementById('new-svc-resp-successfield').value.trim() || 'status';
    const respSuccessValue = document.getElementById('new-svc-resp-successvalue').value.trim() || '200';
    const respMessageField = document.getElementById('new-svc-resp-msgfield').value.trim() || 'message';
    const respRefField = document.getElementById('new-svc-resp-reffield').value.trim();
    const respPdfField = document.getElementById('new-svc-resp-pdffield').value.trim();
    const respExtraFields = {};
    document.getElementById('new-svc-resp-extrafields').value.split('\n').forEach(line=>{
      const idx = line.indexOf('=');
      if(idx === -1) return;
      const label = line.slice(0,idx).trim();
      const path = line.slice(idx+1).trim();
      if(label && path) respExtraFields[label] = path;
    });
    const apiParamInputs = document.querySelectorAll('.svc-field-apiparam');
    const apiParamMap = {};
    if(automated){
      fieldInputs.forEach((inp, i)=>{
        const label = inp.value.trim();
        const param = apiParamInputs[i] ? apiParamInputs[i].value.trim() : '';
        if(label && param) apiParamMap[label] = param;
      });
    }

    const maintenance = document.getElementById('new-svc-maintenance').checked;

    if(!name || !category || isNaN(price)){
      alert('Name, category, and price are required. (Add a category above first if the list is empty)');
      return;

    if(automated && (!apiProvider || !apiUrl)){

      useXApiKeyHeader: automated ? useXApiKeyHeader : false,
      apiMethod: automated ? apiMethod : '', apiBodyType: automated ? apiBodyType : '',
      respSuccessField: automated ? respSuccessField : '', respSuccessValue: automated ? respSuccessValue : '',
      respMessageField: automated ? respMessageField : '', respRefField: automated ? respRefField : '',
      respPdfField: automated ? respPdfField : '',
      respExtraFields: automated ? respExtraFields : {},
      maintenance,
    };
    if(editingServiceId){
      await setDoc(doc(db,'services',editingServiceId), svcData); // full overwrite so removed fields actually clear
    } else {
      await addDoc(collection(db,'services'), { ...svcData, createdAt: new Date().toISOString() });

  let salesFilterMode = 'all';
  window.loadSales = async function(mode){
    if(mode) salesFilterMode = mode;
    const panel = document.getElementById('panel-sales');
    panel.innerHTML = '<div class="empty">Loading...</div>';
    const q = query(collection(db,'serviceRequests'), where('status','==','success'));
    const snap = await getDocs(q);

    const todayStr = new Date().toISOString().slice(0,10);
    const byService = {};
    snap.forEach(d=>{
      const r = d.data();
      if(salesFilterMode === 'today' && !(r.submittedAt||'').startsWith(todayStr)) return;
      const key = r.serviceName || 'Unknown';
      if(!byService[key]) byService[key] = { count:0, revenue:0 };
      byService[key].count++;
      byService[key].revenue += (r.price||0);
    });
    const rows = Object.entries(byService).map(([name,v])=>({ name, ...v }));
    rows.sort((a,b)=> b.count - a.count);

    const totalCount = rows.reduce((s,r)=>s+r.count,0);
    const totalRevenue = rows.reduce((s,r)=>s+r.revenue,0);

    let html = `
      <div class="field" style="margin-bottom:12px;">
        <label>Time Range</label>
        <select onchange="loadSales(this.value)">
          <option value="all" ${salesFilterMode==='all'?'selected':''}>All Time</option>
          <option value="today" ${salesFilterMode==='today'?'selected':''}>Today</option>
        </select>
      </div>
      <div class="card">
        <div class="name">Total: ${totalCount} successful sells &nbsp;•&nbsp; ₹${totalRevenue}</div>
      </div>`;

    if(rows.length === 0){
      html += '<div class="empty">Is time range me koi successful sell nahi hai.</div>';
    } else {
      rows.forEach(r=>{
        html += `
          <div class="card">
            <div class="row">
              <div class="name">${escapeHtml(r.name)}</div>
              <span class="badge active">${r.count} sold</span>
            </div>
            <div class="meta">Revenue: ₹${r.revenue}</div>
          </div>`;
      });
    }
    panel.innerHTML = html;
  }

  async function loadSettings(){

    panel.innerHTML = '<div class="empty">Loading...</div>';
    let regFeeRetailer = '', regFeeDistributer = '';
    try{
      const s = await getDoc(doc(db,'settings','config'));
      if(s.exists()){
        regFeeRetailer = s.data().regFeeRetailer ?? '';

  window.saveSettings = async function(){
    const regFeeRetailer = parseFloat(document.getElementById('settings-regfee-retailer').value);
    const regFeeDistributer = parseFloat(document.getElementById('settings-regfee-distributer').value);
    if(isNaN(regFeeRetailer) || regFeeRetailer <= 0 || isNaN(regFeeDistributer) || regFeeDistributer <= 0){
      alert('Enter valid fees for both account types.'); return;
    }
    await setDoc(doc(db,'settings','config'), { regFeeRetailer, regFeeDistributer }, { merge: true });

  window.bulkImportServices = async function(){
    const raw = document.getElementById('bulk-import-json').value.trim();
    if(!raw){ alert('Paste the JSON array first.'); return; }
    let list;
    try{ list = JSON.parse(raw); }
    catch(e){ alert('Invalid JSON: ' + e.message); return; }
    if(!Array.isArray(list)){ alert('JSON must be an array of service objects.'); return; }
    let added = 0;
    for(const svc of list){
      if(!svc.name || !svc.category){ continue; }
      await addDoc(collection(db,'services'), {
        name: svc.name, category: svc.category, price: svc.price ?? 0,
        fields: svc.fields || [], logoUrl: svc.logoUrl || '',
        description: svc.description || '', refundPolicy: svc.refundPolicy || '', processingTime: svc.processingTime || '',
        automated: !!svc.automated, apiProvider: svc.apiProvider || '', apiUrl: svc.apiUrl || '', apiKeyParam: svc.apiKeyParam || '', useXApiKeyHeader: !!svc.useXApiKeyHeader,
        apiParamMap: svc.apiParamMap || {}, apiMethod: svc.apiMethod || 'GET', apiBodyType: svc.apiBodyType || 'form',
        respSuccessField: svc.respSuccessField || '', respSuccessValue: svc.respSuccessValue || '',
        respMessageField: svc.respMessageField || '', respRefField: svc.respRefField || '', respPdfField: svc.respPdfField || '', respExtraFields: svc.respExtraFields || {},
        maintenance: !!svc.maintenance,
        createdAt: new Date().toISOString()
      });
      added++;
    }
    alert(`${added} service(s) imported. Price/logo abhi bhi 0/khali ho sakte hain — Edit se update kar lena.`);
    document.getElementById('bulk-import-json').value = '';
    loadServices();
  }

  window.deleteService = async function(id){
    if(!confirm('Delete this service?')) return;
    await deleteDoc(doc(db,'services',id));
    loadServices();
  }

  // ---------- SERVICE REQUESTS ----------
  async function loadServiceRequests(){
    const panel = document.getElementById('panel-servicereq');
    panel.innerHTML = '<div class="empty">Loading...</div>';
    const q = query(collection(db,'serviceRequests'), where('status','==','pending'));
    const snap = await getDocs(q);
    if(snap.empty){ panel.innerHTML = '<div class="empty">No pending service requests.</div>'; return; }
    let html = '';
    snap.forEach(d=>{
      const r = d.data();
      const formEntries = Object.entries(r.formData || {}).map(([k,v])=>`${escapeHtml(k)}: <b>${escapeHtml(v)}</b>`).join('<br>');
      html += `
        <div class="card">
          <div class="row">
            <div>
              <div class="name">${escapeHtml(r.serviceName)}</div>
              <div class="meta">
                👤 ${escapeHtml(r.name)} &nbsp;•&nbsp; 📱 ${escapeHtml(r.phone)}<br>
                ₹${r.price} &nbsp;•&nbsp; Order: <span class="mono">${d.id.slice(0,8)}</span><br>
                ${formEntries}
              </div>
            </div>
            <span class="badge pending">PENDING</span>
          </div>
          <div class="field" style="margin-top:10px;">
            <label>Result Text (optional)</label>
            <input type="text" id="res-text-${d.id}" placeholder="Result ka text">
          </div>
          <div class="field">
            <label>Result PDF Link (optional)</label>
            <input type="text" id="res-pdf-${d.id}" placeholder="PDF ka URL link">
          </div>
          <div class="actions">
            <button class="btn small gold" onclick="approveServiceRequest('${d.id}','${r.uid}',${r.price})">✓ Success</button>
            <button class="btn small danger" onclick="failServiceRequest('${d.id}','${r.uid}',${r.price})">✕ Failed</button>
            <button class="btn small danger" onclick="deleteRecordPermanently('serviceRequests','${d.id}', loadServiceRequests)">🗑️ Delete</button>
          </div>
        </div>`;
    });
    panel.innerHTML = html;
  }

  window.approveServiceRequest = async function(reqId, uid, price){
    const resultText = document.getElementById('res-text-'+reqId).value.trim();
    const resultPdfUrl = document.getElementById('res-pdf-'+reqId).value.trim();
    if(!confirm('Mark this service as successful? (Balance has already been deducted)')) return;
    await updateDoc(doc(db,'serviceRequests',reqId), {
      status: 'success', resultText: resultText||'', resultPdfUrl: resultPdfUrl||''
    });
    loadServiceRequests();
  }

  window.failServiceRequest = async function(reqId, uid, price){
    const reason = prompt('Fail hone ka reason likhein:');
    if(reason === null) return;
    if(!confirm('Rejecting will refund ₹'+price+' to the user. Confirm?')) return;
    await updateDoc(doc(db,'users',uid), { walletBalance: increment(price) });
    await updateDoc(doc(db,'serviceRequests',reqId), { status: 'failed', failReason: reason });
    loadServiceRequests();
  }

  // ---------- AUTOMATED SERVICE SECTIONS ----------
  // kind: 'success' | 'pending_low_balance' | 'failed'
  async function loadAutoRequests(kind){
    const panelId = kind === 'success' ? 'panel-autosuccess' : kind === 'failed' ? 'panel-autofailed' : 'panel-autopending';
    const panel = document.getElementById(panelId);
    panel.innerHTML = '<div class="empty">Loading...</div>';
    let q;
    if(kind === 'success') q = query(collection(db,'serviceRequests'), where('status','==','success'), where('automated','==',true));
    else if(kind === 'failed') q = query(collection(db,'serviceRequests'), where('status','==','failed'), where('automated','==',true));
    else q = query(collection(db,'serviceRequests'), where('status','==','pending'), where('pendingReason','==','low_balance'));
    const snap = await getDocs(q);
    if(snap.empty){
      const emptyMsgs = { success:'No automated successful requests yet.', failed:'No automated failed requests yet.', pending_low_balance:'Koi request retry ke liye pending nahi hai. 🎉' };
      panel.innerHTML = `<div class="empty">${emptyMsgs[kind]}</div>`;
      return;
    }
    const rows = [];
    snap.forEach(d=> rows.push({ id:d.id, ...d.data() }));
    rows.sort((a,b)=> new Date(b.submittedAt||0) - new Date(a.submittedAt||0));

    const badge = kind === 'success' ? '<span class="badge active">✓ SUCCESS</span>'
                : kind === 'failed' ? '<span class="badge deactivated">✕ FAILED</span>'
                : '<span class="badge pending">⏳ PENDING — LOW BALANCE YA PROVIDER ISSUE</span>';
    const msg = kind === 'failed' ? 'failReason' : 'resultText';

    panel.innerHTML = rows.map(r => `
      <div class="card">
        <div class="row">
          <div>
            <div class="name">${escapeHtml(r.serviceName||'')}</div>
            <div class="meta">
              👤 ${escapeHtml(r.name||'—')} &nbsp;•&nbsp; 📱 ${escapeHtml(r.phone||'—')} &nbsp;•&nbsp; ✉️ ${escapeHtml(r.email||'—')}<br>
              ₹${r.price} &nbsp;•&nbsp; Order: <span class="mono">${r.id.slice(0,8)}</span><br>
              ${r[msg] ? `<b>Response:</b> ${escapeHtml(r[msg])}` : ''}
              ${r.refId ? `<br>Ref: <span class="mono">${escapeHtml(r.refId)}</span>` : ''}
              ${r.extraDetails ? Object.entries(r.extraDetails).map(([k,v])=>`<br>${escapeHtml(k)}: <b>${escapeHtml(String(v))}</b>`).join('') : ''}
              ${r.apiRawResponse ? `<details style="margin-top:6px;"><summary style="cursor:pointer;color:var(--red);">Raw API response (debug)</summary><div class="mono" style="white-space:pre-wrap;font-size:11.5px;margin-top:4px;">${escapeHtml(r.apiRawResponse)}</div></details>` : ''}
            </div>
          </div>
          ${badge}
        </div>
        ${kind === 'pending_low_balance' ? `<div class="actions"><button class="btn small gold" id="retry-btn-${r.id}" onclick="retryAutomatedService('${r.id}')">🔁 Retry Now</button><button class="btn small danger" onclick="deleteRecordPermanently('serviceRequests','${r.id}', () => loadAutoRequests('${kind}'))">🗑️ Delete</button></div>` : `<div class="actions"><button class="btn small danger" onclick="deleteRecordPermanently('serviceRequests','${r.id}', () => loadAutoRequests('${kind}'))">🗑️ Delete</button></div>`}
      </div>`).join('');
  }

  window.retryAutomatedService = async function(reqId){
    const btn = document.getElementById('retry-btn-'+reqId);
    if(btn){ btn.disabled = true; btn.textContent = 'Processing...'; }
    try{
      const idToken = await auth.currentUser.getIdToken();
      const res = await fetch(WORKER_URL + '/process-service', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ idToken, reqId })
      });
      const data = await res.json();
      if(data.status === 'success') alert('Success! ' + (data.message||''));
      else if(data.status === 'failed') alert('Failed: ' + (data.message||'') + ' (Amount refunded to user)');
      else alert('Still pending: ' + (data.message||'API balance abhi bhi kam hai ya koi aur issue hai.'));
    }catch(e){
      alert('Retry error: ' + e.message);
    }
    loadAutoRequests('pending_low_balance');
  }

  // ---------- GENERIC PERMANENT DELETE (used across every admin list) ----------
  window.deleteRecordPermanently = async function(collectionName, docId, reloadFn){
    if(!confirm('Ye record PERMANENTLY delete ho jayega, wapas nahi aayega. Confirm?')) return;
    try{
      await deleteDoc(doc(db, collectionName, docId));
      reloadFn();
    }catch(e){
      alert('Delete failed: ' + e.message + '\n\nFirestore rules me "'+collectionName+'" ke andar "allow delete: if isAdmin();" add karna hoga.');
    }
  }

    const panel = document.getElementById('panel-wallet');
    panel.innerHTML = '<div class="empty">Loading...</div>';
    const q = query(collection(db,'walletRequests'), where('status','==','pending'));
    const snap = await getDocs(q);

    let html = '';
    snap.forEach(d=>{
      const r = d.data();
      html += `
        <div class="card">
          <div class="row">
            <div>
              <div class="name">📱 ${escapeHtml(r.phone)}</div>

  window.approveWalletRequest = async function(reqId, uid, amount){
    if(!confirm('Add this amount to the user wallet?')) return;
    await updateDoc(doc(db,'users',uid), { walletBalance: increment(amount) });

  window.rejectWalletRequest = async function(reqId){
    await updateDoc(doc(db,'walletRequests',reqId), { status: 'failed' });
    loadWalletRequests();
  }
